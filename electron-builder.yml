appId: edu.bobcatrobotics.coderunner
productName: CodeRunner
asar: true
directories:
  output: dist/desktop/installers
  buildResources: dist/desktop/icons
files:
  - apps/launcher/main.cjs
extraResources:
  - from: dist/desktop/resources
    to: runtime
afterSign: apps/launcher/notarize.cjs
mac:
  category: public.app-category.education
  icon: dist/desktop/icons/coderunner.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: apps/launcher/entitlements.mac.plist
  entitlementsInherit: apps/launcher/entitlements.mac.plist
  target:
    - dmg
    - zip
  artifactName: '${productName}-${version}-${arch}.${ext}'
win:
  icon: dist/desktop/icons/coderunner.ico
  target:
    - nsis
  artifactName: '${productName}-${version}-${arch}.${ext}'
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true